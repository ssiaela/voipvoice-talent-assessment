<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoipVoice Talent Assessment</title>
<style>
:root{--bg:#f4f6fa;--surface:#fff;--surface2:#fafbff;--text:#171923;--muted:#6b7280;--border:#e5e7eb;--accent:#5b5ce2;--ok:#159570;--danger:#c44747;--dark:#171923;--shadow:0 14px 36px rgba(20,25,40,.07)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}h1{margin:0 0 8px;font-size:32px;letter-spacing:-.03em}h2{margin:0 0 8px;font-size:21px}h3{margin:0 0 8px}.sub{margin:0;color:var(--muted)}
.hr{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--dark);color:white;padding:26px 18px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:900;margin-bottom:32px}.brand small{display:block;font-size:12px;color:#aeb4c2;margin-top:4px}.side a{display:block;padding:12px 14px;margin:5px 0;border-radius:11px;color:#d8dbe4;text-decoration:none;font-size:14px}.side a.active{background:#2a2d3a;color:#fff;font-weight:800}.side .logout{border-top:1px solid #303440;margin-top:26px;padding-top:15px}.main{padding:32px;max-width:1500px;width:100%}.top,.toolbar,.savebar{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.top{margin-bottom:22px}.card{background:white;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:22px;margin-bottom:18px}.toolbar{align-items:center;margin-bottom:17px}.toolbar-actions,.tabs{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid transparent;border-radius:11px;padding:10px 14px;font-weight:800}.primary{background:var(--accent);color:white}.secondary{background:white;border-color:var(--border);color:var(--text)}.danger{background:#fff4f4;border-color:#f2d2d2;color:var(--danger)}.small{padding:7px 9px;font-size:12px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-weight:800;font-size:11px}.green{background:#e9f8f2;color:#0d7456}.blue{background:#eef1ff;color:#5153bd}.yellow{background:#fff5df;color:#8b6214}.version{background:#eef1ff;color:#5153bd;padding:8px 11px;border-radius:999px;font-weight:800;font-size:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}.kpi{background:white;border:1px solid var(--border);border-radius:15px;padding:17px}.kpi span{display:block;color:var(--muted);font-size:12px}.kpi strong{display:block;font-size:27px;margin-top:6px}label{display:grid;gap:6px;font-size:13px;font-weight:800}input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:10px;background:white;color:var(--text)}textarea{min-height:80px;resize:vertical}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}.callout{padding:14px 15px;border:1px solid #dedffd;background:#f5f5ff;border-radius:13px;font-size:13px;line-height:1.5;margin-bottom:18px}.success{padding:13px 14px;background:#eaf8f2;color:#0d7456;border-radius:12px;margin-top:12px;font-size:13px;font-weight:700}.error{padding:13px 14px;background:#fff1f1;color:#9f3535;border-radius:12px;margin-top:12px;font-size:13px;font-weight:700}.linkbox{display:flex;gap:8px;margin-top:9px}.linkbox input{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.login,.candidate{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 15% 10%,rgba(91,92,226,.10),transparent 28rem),var(--bg)}.login-card,.candidate-card{width:min(680px,100%);padding:34px;background:white;border:1px solid var(--border);border-radius:24px;box-shadow:0 22px 60px rgba(20,25,40,.1)}.logo{display:flex;align-items:center;gap:11px;font-weight:900;margin-bottom:25px}.mark{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;color:white;background:linear-gradient(135deg,#5b5ce2,#7c62ff)}.candidate-card h1{font-size:44px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.meta div{padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface2)}.meta strong{display:block;font-size:13px}.meta span{color:var(--muted);font-size:12px}.foot{font-size:11px;color:#8a90a0;line-height:1.5;margin-top:18px}.test{min-height:100vh;padding:28px}.testmain{width:min(900px,100%);margin:auto}.progress{height:8px;background:#e9ebf1;border-radius:99px;overflow:hidden;margin:14px 0 24px}.progress span{display:block;height:100%;background:var(--accent)}.qcard{padding:28px;background:white;border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow)}.qtype{font-size:12px;text-transform:uppercase;color:var(--accent);font-weight:900}.qtext{font-size:24px;font-weight:800;line-height:1.35;margin:13px 0 22px}.choices{display:grid;gap:10px}.choice{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--border);border-radius:12px}.choice:hover{background:#fbfbff;border-color:#b9baf4}.choice input{width:auto;margin-top:3px}.testnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.complete{text-align:center}.complete .check{font-size:52px;color:var(--ok)}
.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.score{padding:17px;border:1px solid var(--border);border-radius:15px}.scorehead{display:flex;justify-content:space-between;gap:10px}.scorehead strong:last-child{font-size:23px;color:var(--accent)}.bar{height:7px;background:#eceef3;border-radius:99px;overflow:hidden;margin:11px 0}.bar span{display:block;height:100%;background:var(--accent)}.score p{font-size:12px;color:var(--muted);line-height:1.5}.scenario{padding:16px;border:1px solid var(--border);background:#f8f9ff;border-radius:14px;margin-bottom:15px}.scenario strong{font-size:25px;color:var(--accent)}
.tabs{margin-bottom:17px}.tabs .active{background:var(--accent);color:white;border-color:var(--accent)}.editor{padding:15px;border:1px solid var(--border);border-radius:14px;margin-bottom:10px}.ehead{display:flex;gap:10px;align-items:flex-start;margin-bottom:11px}.num{display:grid;place-items:center;min-width:32px;height:32px;border-radius:9px;background:#eef1ff;color:#5153bd;font-size:12px;font-weight:900}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#eef1ff;color:#5153bd;font-size:10px;font-weight:800;margin:2px}.editgrid{display:grid;grid-template-columns:1.5fr .8fr .8fr;gap:9px}.answerrow{display:grid;grid-template-columns:40px 1fr 90px;gap:8px;align-items:center;margin-top:8px}.akey{display:grid;place-items:center;width:33px;height:33px;border-radius:8px;background:#f0f1f5;font-weight:900}.rangerow{display:grid;grid-template-columns:85px 85px 1fr 1.4fr;gap:8px;margin-bottom:9px}.savebar{position:sticky;bottom:14px;align-items:center;padding:13px 15px;background:rgba(255,255,255,.97);border:1px solid var(--border);border-radius:14px;box-shadow:0 14px 32px rgba(20,25,40,.13)}.auditrow{padding:11px 0;border-bottom:1px solid var(--border);font-size:13px}.auditrow span{display:block;font-size:11px;color:var(--muted);margin-top:3px}
@media(max-width:1000px){.hr{grid-template-columns:1fr}.side{display:none}.kpis,.grid2,.grid3,.scoregrid,.editgrid{grid-template-columns:1fr}.rangerow{grid-template-columns:1fr 1fr}.rangerow>*:nth-child(n+3){grid-column:1/-1}}@media(max-width:650px){.main,.test{padding:18px}.top,.toolbar,.savebar,.testnav{flex-direction:column;align-items:stretch}.meta{grid-template-columns:1fr}.candidate-card h1{font-size:36px}.qtext{font-size:21px}.linkbox{flex-direction:column}.answerrow{grid-template-columns:35px 1fr}.answerrow input:last-child{grid-column:2}}
</style></head><body><div id="app"></div>
<script>
const app=document.getElementById('app');let session=false,settingsData=null,settingsTab='questions',candidateCtx=null,resultToken=null;
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>x?new Date(x).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'}):'—';
async function api(path,opt={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||('Errore '+r.status));return d}
function pathRoute(){const p=location.pathname;if(p.startsWith('/c/'))return {kind:'candidate',token:decodeURIComponent(p.slice(3))};return {kind:'hr'}}
window.addEventListener('popstate',render);function go(p){history.pushState({},'',p);render()}
async function render(){const r=pathRoute();if(r.kind==='candidate')return candidateHome(r.token);const b=await api('/api/bootstrap');session=b.authenticated;if(!session)return login();const section=new URLSearchParams(location.search).get('section')||'candidates';return hrSection(section)}
function login(){app.innerHTML=`<div class="login"><section class="login-card"><div class="logo"><span class="mark">V</span>VoipVoice HR</div><h1>Area riservata</h1><p class="sub">Gestisci candidature, risultati e configurazione del test.</p><label style="margin-top:22px">Password<input id="pwd" type="password"></label><button class="btn primary" style="width:100%;margin-top:13px" onclick="doLogin()">Accedi</button><div id="msg"></div><div class="foot">La password di accesso viene configurata dall'amministratore e non è inclusa nel codice.</div></section></div>`}
async function doLogin(){try{await api('/api/hr/login',{method:'POST',body:JSON.stringify({password:document.getElementById('pwd').value})});history.replaceState({},'', '/hr?section=candidates');render()}catch(e){document.getElementById('msg').innerHTML=`<div class="error">${E(e.message)}</div>`}}
async function logout(){await api('/api/hr/logout',{method:'POST',body:'{}'});history.replaceState({},'', '/hr');render()}
function shell(section,content){app.innerHTML=`<div class="hr"><aside class="side"><div class="brand">VoipVoice HR<small>Talent assessment</small></div><nav><a class="${section==='candidates'?'active':''}" href="javascript:nav('candidates')">Candidature</a><a class="${section==='results'?'active':''}" href="javascript:nav('results')">Risultati</a><a class="${section==='settings'?'active':''}" href="javascript:nav('settings')">Impostazioni</a><a class="${section==='audit'?'active':''}" href="javascript:nav('audit')">Registro e versioni</a><div class="logout"><a href="javascript:logout()">Esci</a></div></nav></aside><main class="main">${content}</main></div>`}function nav(s){history.pushState({},'',`/hr?section=${s}`);hrSection(s)}
async function hrSection(s){if(s==='results')return results();if(s==='settings')return settings();if(s==='audit')return audit();return candidates()}

async function candidates(){const [b,d]=await Promise.all([api('/api/bootstrap'),api('/api/hr/candidates')]);const items=d.items||[],done=items.filter(x=>x.status==='completed').length;const rows=items.map(c=>`<tr><td><strong>${E(c.name)}</strong><br><span class="muted">${E(c.position||'')}</span></td><td>v${E(c.label)}</td><td>${fmt(c.created_at)}</td><td><span class="badge ${c.status==='completed'?'green':'blue'}">${c.status==='completed'?'Completato':c.status==='started'?'In corso':'Inviato'}</span></td><td>${c.status==='completed'?`<button class="btn secondary small" onclick="openResult('${c.token}')">Risultato</button>`:`<button class="btn secondary small" onclick="copyLink('${c.token}')">Copia link</button>`}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Nessun candidato.</td></tr>';shell('candidates',`<div class="top"><div><h1>Candidature</h1><p class="sub">Genera un link personale e controlla l'avanzamento.</p></div><span class="version">Test v${E(b.currentVersion)}</span></div><div class="kpis"><div class="kpi"><span>Inviti</span><strong>${items.length}</strong></div><div class="kpi"><span>Da completare</span><strong>${items.length-done}</strong></div><div class="kpi"><span>Completati</span><strong>${done}</strong></div><div class="kpi"><span>Versione attiva</span><strong>${E(b.currentVersion)}</strong></div></div><section class="card"><h2>Nuovo invito</h2><div class="grid3" style="margin-top:14px"><label>Nome candidato<input id="cname"></label><label>Posizione<input id="cposition"></label><label>Scadenza<select id="cexp"><option value="7">7 giorni</option><option value="14">14 giorni</option><option value="30">30 giorni</option></select></label></div><button class="btn primary" style="margin-top:14px" onclick="newInvite()">Genera link candidato</button><div id="inviteMsg"></div></section><section class="card"><h2>Candidati</h2><div style="overflow:auto"><table><thead><tr><th>Candidato</th><th>Versione</th><th>Invito</th><th>Stato</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>`)}
async function newInvite(){try{const d=await api('/api/hr/invitations',{method:'POST',body:JSON.stringify({name:document.getElementById('cname').value,position:document.getElementById('cposition').value,expiryDays:Number(document.getElementById('cexp').value)})});document.getElementById('inviteMsg').innerHTML=`<div class="success">Link v${E(d.version)} generato:<div class="linkbox"><input id="newLink" readonly value="${E(d.url)}"><button class="btn secondary" onclick="navigator.clipboard.writeText(document.getElementById('newLink').value)">Copia</button><button class="btn secondary" onclick="window.open(document.getElementById('newLink').value,'_blank')">Apri</button></div></div>`}catch(e){document.getElementById('inviteMsg').innerHTML=`<div class="error">${E(e.message)}</div>`}}
async function copyLink(token){const d=await api('/api/hr/candidates');const c=d.items.find(x=>x.token===token);const url=location.origin+'/c/'+encodeURIComponent(token);await navigator.clipboard.writeText(url);alert('Link copiato: '+url)}

async function candidateHome(token){try{const d=await api('/api/candidate/test?token='+encodeURIComponent(token));candidateCtx={token,data:d,answers:d.answers||{},index:0};if(d.status==='completed')return candidateDone(d.name);const first=d.questions.findIndex(q=>candidateCtx.answers[String(q.id)]==null);candidateCtx.index=first<0?0:first;app.innerHTML=`<div class="candidate"><section class="candidate-card"><div class="logo"><span class="mark">V</span>VoipVoice</div><span class="badge blue">Valutazione attitudinale</span><h1>Benvenuto, ${E(d.name)}.</h1><p class="sub">Da questo link puoi esclusivamente svolgere il questionario assegnato. I risultati sono riservati all'area HR.</p><div class="meta"><div><strong>Durata</strong><span>15–20 minuti</span></div><div><strong>Domande</strong><span>${d.questions.length}</span></div><div><strong>Versione</strong><span>${E(d.version)}</span></div></div><button class="btn primary" style="width:100%" onclick="startCandidate()">${d.status==='started'?'Continua il test':'Inizia il test'}</button><div class="foot">Questa interfaccia non contiene menu, risultati o collegamenti all'area HR.</div></section></div>`}catch(e){app.innerHTML=`<div class="candidate"><section class="candidate-card"><div class="logo"><span class="mark">V</span>VoipVoice</div><h1>Link non disponibile</h1><p class="sub">${E(e.message)}</p></section></div>`}}
async function startCandidate(){await api('/api/candidate/start',{method:'POST',body:JSON.stringify({token:candidateCtx.token})});showQuestion()}
function showQuestion(){const {data,index,answers}=candidateCtx,q=data.questions[index],sel=answers[String(q.id)];const choices=q.answers.map(a=>`<label class="choice"><input type="radio" name="ans" value="${E(a.key)}" ${String(sel)===String(a.key)?'checked':''}><span>${q.type==='scenario'?`<strong>${E(a.key)}. </strong>`:''}${E(a.text)}</span></label>`).join('');app.innerHTML=`<div class="test"><main class="testmain"><div class="logo"><span class="mark">V</span>Valutazione attitudinale</div><div class="muted">${E(data.name)} · domanda ${index+1} di ${data.questions.length}</div><div class="progress"><span style="width:${(index+1)/data.questions.length*100}%"></span></div><section class="qcard"><div class="qtype">${q.type==='scenario'?'Scenario situazionale':'Scala di accordo'}</div><div class="qtext">${E(q.text)}</div><div class="choices">${choices}</div><div class="testnav"><button class="btn secondary" ${index===0?'disabled':''} onclick="candidateMove(-1)">Indietro</button><button class="btn primary" onclick="candidateMove(1)">${index===data.questions.length-1?'Concludi test':'Avanti'}</button></div><div id="qmsg"></div></section></main></div>`}
async function candidateMove(delta){const q=candidateCtx.data.questions[candidateCtx.index];if(delta>0){const r=document.querySelector('input[name=ans]:checked');if(!r)return document.getElementById('qmsg').innerHTML='<div class="error">Seleziona una risposta.</div>';candidateCtx.answers[String(q.id)]=r.value;try{await api('/api/candidate/save',{method:'POST',body:JSON.stringify({token:candidateCtx.token,answers:candidateCtx.answers})})}catch(e){return document.getElementById('qmsg').innerHTML=`<div class="error">${E(e.message)}</div>`}}const n=candidateCtx.index+delta;if(n<0)return;if(n>=candidateCtx.data.questions.length){try{await api('/api/candidate/submit',{method:'POST',body:JSON.stringify({token:candidateCtx.token,answers:candidateCtx.answers})});return candidateDone(candidateCtx.data.name)}catch(e){return document.getElementById('qmsg').innerHTML=`<div class="error">${E(e.message)}</div>`}}candidateCtx.index=n;showQuestion()}
function candidateDone(name){app.innerHTML=`<div class="candidate"><section class="candidate-card complete"><div class="check">✓</div><h1>Test completato</h1><p class="sub">Grazie, ${E(name)}. Le risposte sono state registrate. I risultati saranno consultabili esclusivamente dal team HR.</p><div class="success">Puoi chiudere questa pagina.</div></section></div>`}

async function results(){const d=await api('/api/hr/results');const rows=d.items.map(c=>`<tr><td><strong>${E(c.name)}</strong><br><span class="muted">${E(c.position||'')}</span></td><td>v${E(c.label)}</td><td>${fmt(c.completed_at)}</td><td><button class="btn secondary small" onclick="openResult('${c.token}')">Apri report</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Nessun test completato.</td></tr>';shell('results',`<div class="top"><div><h1>Risultati</h1><p class="sub">Ogni report usa la configurazione della versione effettivamente svolta.</p></div></div><section class="card"><div style="overflow:auto"><table><thead><tr><th>Candidato</th><th>Versione</th><th>Completato</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section><div id="result"></div>`);if(resultToken)resultDetail(resultToken)}
async function openResult(t){resultToken=t;if(new URLSearchParams(location.search).get('section')!=='results'){nav('results')}else resultDetail(t)}
function findRange(ranges,s){return ranges.find(r=>s>=Number(r.min)&&s<=Number(r.max))||ranges[ranges.length-1]}
async function resultDetail(t){try{const d=await api('/api/hr/result?token='+encodeURIComponent(t)),r=d.result,c=d.config;const cards=c.competencies.map(x=>{const s=r.scores[x.name]||0,k=findRange(c.ranges,s);return `<div class="score"><div class="scorehead"><strong>${E(x.name)}</strong><strong>${s.toFixed(0)}</strong></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,s))}%"></span></div><span class="badge ${s>=65?'green':s>=45?'blue':'yellow'}">${E(k.label)}</span><p><strong>Uso in colloquio:</strong> ${E(k.interview)}</p><p><strong>Approfondimento:</strong> ${E(x.suggestion)}</p></div>`}).join('');document.getElementById('result').innerHTML=`<section class="card"><div class="toolbar"><div><h2>${E(d.candidate.name)}</h2><div class="muted">${E(d.candidate.position||'')} · v${E(d.candidate.version)} · ${fmt(d.candidate.completedAt)}</div></div><button class="btn secondary" onclick="resultToken=null;document.getElementById('result').innerHTML=''">Chiudi</button></div><div class="scenario">Punteggio scenari: <strong>${r.scenarioScore.toFixed(0)}/100</strong><div class="muted">Media normalizzata delle 10 situazioni lavorative.</div></div><div class="scoregrid">${cards}</div><div class="foot">Strumento interno di supporto al colloquio; non è un test psicometrico validato e non va usato come unico criterio di esclusione.</div></section>`}catch(e){document.getElementById('result').innerHTML=`<div class="error">${E(e.message)}</div>`}}

async function settings(){const d=await api('/api/hr/settings');settingsData=d.data;shell('settings',`<div class="top"><div><h1>Impostazioni</h1><p class="sub">Modifica in bozza e pubblica una nuova versione.</p></div><span class="version">Pubblicata v${E(d.currentVersion)}</span></div><div class="callout"><strong>Versionamento attivo.</strong> Gli inviti già creati e i risultati storici restano legati alla loro versione. Le modifiche diventano operative solo dopo “Pubblica nuova versione”.</div><div class="tabs"><button class="btn secondary ${settingsTab==='questions'?'active':''}" onclick="setTab('questions')">Domande</button><button class="btn secondary ${settingsTab==='answers'?'active':''}" onclick="setTab('answers')">Risposte</button><button class="btn secondary ${settingsTab==='scoring'?'active':''}" onclick="setTab('scoring')">Punteggi</button><button class="btn secondary ${settingsTab==='security'?'active':''}" onclick="setTab('security')">Sicurezza</button></div><div id="settingsBody"></div><div class="savebar ${settingsTab==='security'?'hidden':''}"><div><strong>Configurazione in modifica</strong><div class="muted" style="font-size:12px">Salva bozza per conservarla sul server senza renderla attiva.</div></div><div class="toolbar-actions"><button class="btn secondary" onclick="saveDraft()">Salva bozza</button><button class="btn danger" onclick="discardDraft()">Annulla bozza</button><button class="btn primary" onclick="publishSettings()">Pubblica nuova versione</button></div></div>`);settingsBody()}
function setTab(t){settingsTab=t;settings()}
function compOptions(value,none=false){return (none?'<option value="">Nessuna</option>':'')+settingsData.competencies.map(c=>`<option value="${E(c.name)}" ${c.name===value?'selected':''}>${E(c.name)}</option>`).join('')}
function settingsBody(){const el=document.getElementById('settingsBody');if(settingsTab==='questions'){el.innerHTML=`<section class="card"><h2>Domande (${settingsData.questions.length})</h2><p class="muted">Modifica testo e competenze associate.</p>${settingsData.questions.map((q,i)=>`<div class="editor"><div class="ehead"><span class="num">${q.id}</span><div><strong>${E(q.text)}</strong><div><span class="pill">${E(q.scoring.primary)}</span>${q.scoring.secondary?`<span class="pill">+ ${E(q.scoring.secondary)}</span>`:''}</div></div></div><div class="editgrid"><label>Testo<textarea onchange="settingsData.questions[${i}].text=this.value">${E(q.text)}</textarea></label><label>Competenza primaria<select onchange="settingsData.questions[${i}].scoring.primary=this.value">${compOptions(q.scoring.primary)}</select></label><label>Competenza secondaria<select onchange="settingsData.questions[${i}].scoring.secondary=this.value||null">${compOptions(q.scoring.secondary,true)}</select></label></div></div>`).join('')}</section>`}else if(settingsTab==='answers'){el.innerHTML=`<section class="card"><h2>Risposte e punti</h2><p class="muted">Puoi modificare sia il testo sia il valore attribuito a ciascuna risposta.</p>${settingsData.questions.map((q,i)=>`<div class="editor"><div class="ehead"><span class="num">${q.id}</span><div><strong>${E(q.text)}</strong><div class="muted">${q.type==='scenario'?'Scenario':'Scala'} ${q.scoring.inverse?'· inversa':''}</div></div></div>${q.answers.map((a,j)=>`<div class="answerrow"><span class="akey">${E(a.key)}</span><input value="${E(a.text)}" onchange="settingsData.questions[${i}].answers[${j}].text=this.value"><input type="number" step=".1" value="${Number(a.points)}" onchange="settingsData.questions[${i}].answers[${j}].points=Number(this.value)"></div>`).join('')}</div>`).join('')}</section>`}else if(settingsTab==='scoring'){el.innerHTML=`<section class="card"><h2>Fasce di valutazione</h2>${settingsData.ranges.map((r,i)=>`<div class="rangerow"><input type="number" step=".01" value="${r.min}" onchange="settingsData.ranges[${i}].min=Number(this.value)"><input type="number" step=".01" value="${r.max}" onchange="settingsData.ranges[${i}].max=Number(this.value)"><input value="${E(r.label)}" onchange="settingsData.ranges[${i}].label=this.value"><input value="${E(r.interview)}" onchange="settingsData.ranges[${i}].interview=this.value"></div>`).join('')}</section><section class="card"><h2>Pesi e item inversi</h2><div class="grid2"><label>Peso competenza primaria<input type="number" step=".1" min="0" value="${settingsData.weights?.primary??1}" onchange="settingsData.weights.primary=Number(this.value)"></label><label>Peso competenza secondaria<input type="number" step=".1" min="0" value="${settingsData.weights?.secondary??1}" onchange="settingsData.weights.secondary=Number(this.value)"></label></div><div style="overflow:auto;margin-top:16px"><table><thead><tr><th>N.</th><th>Domanda scala</th><th>Inversa</th></tr></thead><tbody>${settingsData.questions.filter(q=>q.type==='scale').map(q=>{const i=settingsData.questions.indexOf(q);return `<tr><td>${q.id}</td><td>${E(q.text)}</td><td><select onchange="settingsData.questions[${i}].scoring.inverse=this.value==='1'"><option value="0" ${!q.scoring.inverse?'selected':''}>No</option><option value="1" ${q.scoring.inverse?'selected':''}>Sì</option></select></td></tr>`}).join('')}</tbody></table></div></section>`}else{el.innerHTML=`<div class="grid2"><section class="card"><h2>Cambia password HR</h2><div style="display:grid;gap:12px;margin-top:15px"><label>Password attuale<input id="oldp" type="password"></label><label>Nuova password<input id="newp" type="password"></label><label>Conferma<input id="newp2" type="password"></label></div><button class="btn primary" style="margin-top:14px" onclick="passwordChange()">Aggiorna password</button><div id="passMsg"></div></section><section class="card"><h2>Sicurezza</h2><p class="muted">La password viene verificata e memorizzata come hash lato server. Il candidato non dispone di API per leggere risultati o configurazione di scoring.</p><p class="muted">Per la produzione serviranno comunque HTTPS, backup, gestione utenti/ruoli, rate limiting e protezioni CSRF appropriate.</p></section></div>`}}
async function saveDraft(){try{await api('/api/hr/settings/draft',{method:'POST',body:JSON.stringify({data:settingsData})});alert('Bozza salvata sul server.')}catch(e){alert(e.message)}}
async function discardDraft(){if(!confirm('Eliminare la bozza e ripartire dalla versione pubblicata?'))return;await api('/api/hr/settings/discard',{method:'POST',body:'{}'});settings()}
async function publishSettings(){if(!confirm('Pubblicare una nuova versione? I vecchi inviti resteranno sulla loro versione.'))return;try{const d=await api('/api/hr/settings/publish',{method:'POST',body:JSON.stringify({data:settingsData})});alert('Pubblicata versione '+d.version);settings()}catch(e){alert(e.message)}}
async function passwordChange(){const a=document.getElementById('oldp').value,b=document.getElementById('newp').value,c=document.getElementById('newp2').value;if(b!==c)return document.getElementById('passMsg').innerHTML='<div class="error">Le nuove password non coincidono.</div>';try{await api('/api/hr/password',{method:'POST',body:JSON.stringify({oldPassword:a,newPassword:b})});document.getElementById('passMsg').innerHTML='<div class="success">Password aggiornata. Effettua nuovamente l’accesso.</div>';setTimeout(()=>{history.replaceState({},'', '/hr');render()},900)}catch(e){document.getElementById('passMsg').innerHTML=`<div class="error">${E(e.message)}</div>`}}

async function audit(){const d=await api('/api/hr/audit');const vers=d.versions.map(v=>`<tr><td>v${E(v.label)}</td><td>${fmt(v.created_at)}</td><td>${v.is_current?'<span class="badge green">Attiva</span>':'<span class="badge blue">Storica</span>'}</td><td>${v.invitations}</td></tr>`).join('');shell('audit',`<div class="top"><div><h1>Registro e versioni</h1><p class="sub">Controlla che inviti, modifiche e risultati restino collegati alla versione corretta.</p></div></div><div class="grid2"><section class="card"><h2>Versioni</h2><table><thead><tr><th>Versione</th><th>Data</th><th>Stato</th><th>Inviti</th></tr></thead><tbody>${vers}</tbody></table></section><section class="card"><h2>Attività</h2>${d.audit.map(x=>`<div class="auditrow"><strong>${E(x.event)}</strong><span>${fmt(x.created_at)}</span></div>`).join('')}</section></div>`)}
render().catch(e=>{app.innerHTML=`<div class="candidate"><section class="candidate-card"><h1>Errore</h1><p class="sub">${E(e.message)}</p></section></div>`});
</script></body></html>
